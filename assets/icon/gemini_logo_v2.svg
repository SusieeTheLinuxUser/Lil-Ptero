<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <!-- Tło dopasowane do interfejsu aplikacji -->
    <rect width="800" height="800" fill="#0b1116"/>

    <!-- Grupa centralna przesunięta dla idealnego balansu -->
    <g transform="translate(10, 20)">
        <!-- Główny górny grzebień / Dziób ptero (Jasny cyjan) -->
        <path d="M380,290 L520,210 L440,320 Z" fill="#00e5ff" opacity="0.95"/>
        <path d="M440,320 L520,210 L650,210 Z" fill="#00b0ff"/>

        <!-- Górne fasetki cieniowane (Ciemny teal) -->
        <path d="M380,290 L440,320 L420,350 Z" fill="#006064"/>
        <path d="M440,320 L480,350 L420,350 Z" fill="#00838f"/>
        <path d="M440,320 L520,210 L480,350 Z" fill="#00bcd4"/>

        <!-- Lewe wydłużone pióro / Dziób papugi (Ostry szpic w lewo) -->
        <path d="M380,290 L420,350 L250,450 Z" fill="#00b0ff"/>
        <path d="M350,410 L420,350 L250,450 Z" fill="#00e5ff" opacity="0.8"/>

        <!-- Centralny jasny rdzeń (Błękit lodowy / Light Teal) -->
        <path d="M420,350 L480,350 L450,430 Z" fill="#b2ebf2"/>
        <path d="M420,350 L450,430 L380,450 Z" fill="#4dd0e1"/>

        <!-- Dolna bryła / Korpus (Mocny nasycony cyjan) -->
        <path d="M450,430 L480,350 L530,440 Z" fill="#00bcd4"/>
        <path d="M450,430 L530,440 L560,540 Z" fill="#00b0ff"/>
        <path d="M450,430 L560,540 L490,580 Z" fill="#00e5ff"/>
        <path d="M380,450 L450,430 L490,580 Z" fill="#00b0ff"/>
        <path d="M380,450 L490,580 L450,510 Z" fill="#00838f"/>
    </g>
</svg>
