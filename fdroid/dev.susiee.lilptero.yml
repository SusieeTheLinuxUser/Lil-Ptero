# DRAFT F-Droid build recipe for Pterodactyl Mobile (Lil-Ptero).
#
# This file is NOT submitted anywhere yet — it's a working copy kept in this
# repo for reference. To actually submit: fork https://gitlab.com/fdroid/fdroiddata,
# copy this file (with the placeholders below filled in) to metadata/dev.susiee.lilptero.yml
# in that fork, test it locally with fdroidserver, then open a merge request.
# See fdroid/README.md in this repo for the full step-by-step process.
#
# Modeled on F-Droid's official Flutter template (templates/build-flutter.yml
# in fdroiddata) and the real-world dev.imranr.obtainium.fdroid.yml recipe,
# simplified since we ship one universal APK (no split-per-abi).

Categories:
  - Internet
License: MIT
AuthorName: SusieeTheLinuxUser
SourceCode: https://github.com/SusieeTheLinuxUser/Lil-Ptero
IssueTracker: https://github.com/SusieeTheLinuxUser/Lil-Ptero/issues
Changelog: https://github.com/SusieeTheLinuxUser/Lil-Ptero/releases

AutoName: Pterodactyl Mobile
RepoType: git
Repo: https://github.com/SusieeTheLinuxUser/Lil-Ptero.git

Builds:
  # FIXME: fill in once v0.1.0 is actually tagged and pushed — `commit` must be
  # a real tag/commit that exists in the repo, not a placeholder.
  - versionName: '0.1.0'
    versionCode: 1
    commit: v0.1.0
    submodules: false
    sudo:
      - mkdir -p /upstream/lilptero
      - chown -R vagrant /upstream/lilptero
    output: build/app/outputs/flutter-apk/app-release.apk
    # Flutter isn't vendored as a submodule, so pull it in as a pinned srclib
    # instead (matches our GitHub Actions release workflow's pinned version —
    # keep these in sync when bumping Flutter).
    srclibs:
      - flutter@3.47.4
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      # Downloaded Dart/Flutter tooling caches, not part of our source.
      - $$flutter$$/bin/cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.1.0'
CurrentVersionCode: 1
