AutoUpdateMode: Version
UpdateCheckMode: Tags
# ABI digit goes in the lowest position so F-Droid's client always prefers
# the newest version across ABIs: armeabi-v7a < arm64-v8a < x86_64.
VercodeOperation:
  - '10 * %c + 1'
  - '10 * %c + 2'
  - '10 * %c + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
