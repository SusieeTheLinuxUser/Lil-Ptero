# F-Droid build recipe for Pterodactyl Mobile (Lil-Ptero).
#
# TESTED: this exact recipe was run through a real local `fdroid build` (not
# just `fdroid lint`) using fdroidserver 2.4.2 and actually produced
# build/app/outputs/flutter-apk/app-release.apk successfully. See
# fdroid/README.md for how that test was set up and how to redo it.
#
# Still not submitted anywhere — it's a working copy kept in this repo for
# reference. To actually submit: fork https://gitlab.com/fdroid/fdroiddata,
# copy this file (comments stripped — F-Droid asks for that) to
# metadata/dev.susiee.lilptero.yml in that fork, and open a merge request.
# See fdroid/README.md for the full step-by-step process.
#
# Modeled on a real, currently-building Flutter recipe already in fdroiddata
# (com.iakmds.librecamera.yml — "Libre Camera") rather than guessed syntax.
# An earlier draft had a `scanignore: [$$flutter$$/bin/cache]` entry copied
# from F-Droid's official template — removed, because it broke the real
# build: that path doesn't exist yet when the source scanner runs (it's only
# created once `flutter pub get`/`flutter build` execute, which happens
# later). LibreCamera's real recipe doesn't have one either.

Categories:
  - Internet
License: MIT
AuthorName: SusieeTheLinuxUser
SourceCode: https://github.com/SusieeTheLinuxUser/Lil-Ptero
IssueTracker: https://github.com/SusieeTheLinuxUser/Lil-Ptero/issues
Changelog: https://github.com/SusieeTheLinuxUser/Lil-Ptero/releases

AutoName: Pterodactyl Mobile
RepoType: git
Repo: https://github.com/SusieeTheLinuxUser/Lil-Ptero.git

Builds:
  - versionName: '0.1.0'
    versionCode: 1
    commit: 88335637632149d32e23f846df1aa8062df36c20 # tag v0.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    # Pinned to match .github/workflows/release.yml's flutter-version — keep
    # these in sync when bumping Flutter.
    srclibs:
      - flutter@3.47.4
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.1.0'
CurrentVersionCode: 1
