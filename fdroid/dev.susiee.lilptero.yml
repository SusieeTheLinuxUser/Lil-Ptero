# F-Droid build recipe for Pterodactyl Mobile (Lil-Ptero).
#
# Submitted as merge request !49236: https://gitlab.com/fdroid/fdroiddata/-/merge_requests/49236
# This file is kept in sync with metadata/dev.susiee.lilptero.yml in the
# gitlab.com/SusieeTheLinuxUser/fdroiddata fork's dev.susiee.lilptero branch
# — edit it here first, re-test (see fdroid/README.md), then copy the change
# over and push to that branch to update the MR.
#
# v0.1.0 (versionCode 1) was rejected by F-Droid's CI "check apk" job:
# "Found extra signing block 'Dependency metadata'" — Android Gradle Plugin
# embeds that block by default for Play Console's dependency-vulnerability
# scanning, and F-Droid's scanner treats any extra signing-block content as
# suspicious. Fixed in v0.1.1 (versionCode 2) via `dependenciesInfo {
# includeInApk = false }` in android/app/build.gradle.kts.
#
# Second round of CI feedback (reviewer linsui, on the v0.1.1 pipeline):
# asked for (1) ABI-split builds, (2) reproducible-build metadata. v0.1.2
# switches to three per-ABI Builds blocks (armeabi-v7a/arm64-v8a/x86_64),
# each with its own versionCode (base build number * 10 + ABI digit, per
# https://f-droid.org/en/docs/Submitting_to_F-Droid_Quick_Start_Guide/#setup-abi-split)
# — matched on the app side by the versionCodeOverride block added to
# android/app/build.gradle.kts. Verified locally: `flutter build apk
# --release --split-per-abi --target-platform="android-arm"` (etc., one per
# ABI, mirroring how F-Droid's build server invokes each Builds block)
# produces versionCodes 31/32/33 for build number 3, matching this recipe.
#
# Reproducible builds use GitHub Actions' checkout and Pub-cache paths. The
# jni package also needs its Android SDK path mapped to GitHub's standard path;
# otherwise only libdartjni.so's GNU build ID differs.
#
# Third round of feedback (linsui, on the reproducible-build submission):
# (1) pin the Flutter version instead of tracking `stable`, extracted straight
# from .github/workflows/release.yml so it can't drift from what actually
# built the published APK — see the `flutterVersion=...` / `git checkout`
# lines in `prebuild`; (2) the jni CMakeLists.txt sed target was pinned to
# `jni-1.0.3`, which breaks the moment that dependency bumps — switched to
# the version-agnostic glob `jni-*`. Full pipeline (fdroid build, check apk,
# fdroid lint, fdroid rewritemeta) passed:
# https://gitlab.com/SusieeTheLinuxUser/fdroiddata/-/pipelines/2862036916
#
# 2026-09-18: linsui called the MR "mostly ready" and will test it when they
# get to it — no action needed from us unless a new app version ships, in
# which case update this MR rather than opening a new one.
#
# Modeled on a real, currently-building Flutter recipe already in fdroiddata
# (com.iakmds.librecamera.yml — "Libre Camera") plus F-Droid's own
# templates/build-flutter.yml template for the ABI-split structure, rather
# than guessed syntax.

Categories:
  - Internet
License: MIT
AuthorName: SusieeTheLinuxUser
SourceCode: https://github.com/SusieeTheLinuxUser/Lil-Ptero
IssueTracker: https://github.com/SusieeTheLinuxUser/Lil-Ptero/issues
Changelog: https://github.com/SusieeTheLinuxUser/Lil-Ptero/releases

AutoName: Pterodactyl Mobile

RepoType: git
Repo: https://github.com/SusieeTheLinuxUser/Lil-Ptero.git

Builds:
  - versionName: 0.1.2
    versionCode: 31
    commit: 9ce3dd68ca951a26017248fb97c4ba52160baf98
    sudo:
      - mkdir -p /home/runner/work/Lil-Ptero
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/SusieeTheLinuxUser/Lil-Ptero/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - f=.github/workflows/release.yml
      - flutterVersion=$(awk -F\" '/flutter-version/ {print $2}' $f)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/Lil-Ptero/Lil-Ptero
      - cd ..
      - mv dev.susiee.lilptero $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/project(jni_library/a add_compile_options("-ffile-prefix-map=$$SDK$$=/usr/local/lib/android/sdk")'
        .pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo dev.susiee.lilptero
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/Lil-Ptero/Lil-Ptero
      - cd ..
      - mv dev.susiee.lilptero $repo
      - pushd $repo
      - mv .pub-cache /home/runner/.pub-cache
      - export PUB_CACHE=/home/runner/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - mv /home/runner/.pub-cache .pub-cache
      - popd
      - mv $repo dev.susiee.lilptero

