name: Release

# Push a tag like v0.2.0 (after bumping the version in pubspec.yaml) to build a
# signed release APK and publish it as a GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write release signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/release-key.jks
          EOF

      - run: flutter build apk --release --split-per-abi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
          body: |
            Pick the APK matching your device's CPU — `arm64-v8a` covers essentially all phones sold since ~2017; use `armeabi-v7a` only for very old 32-bit-only devices, `x86_64` only for x86 emulators/devices.

      # Tell SusieeTheLinuxUser/fdroid to republish with the new APKs. Needs a
      # fine-grained token in the FDROID_DISPATCH_TOKEN secret (Contents: read and
      # write on that repo). Without it this step does nothing and the fdroid
      # repo's daily schedule picks the release up instead.
      - name: Notify F-Droid repository
        env:
          GH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FDROID_DISPATCH_TOKEN not set; the fdroid repo's daily run will pick this up."
            exit 0
          fi
          gh api repos/SusieeTheLinuxUser/fdroid/dispatches -f event_type=lilptero-release
