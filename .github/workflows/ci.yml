name: CI

# Static analysis and unit tests on every PR and on pushes to main.
# Release builds/signing stay in release.yml — nothing here needs secrets.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
